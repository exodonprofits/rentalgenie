# One-off: remove the 19 legacy Rental Genie pages from rentalgenieai.com.
#
# They were uploaded by hand before the deploy Action existed, still point at the old shared
# Supabase project (whose Rental Genie tables are read-only since Oct 2 2026) and no current page
# links to them. The deploy Action never deletes files it didn't upload, so they stay until removed.
#
# Run from Actions → "Remove legacy pages" → Run workflow, typing DELETE. The list is fixed below;
# nothing else on the server is touched. Each file is downloaded first and kept as the run's
# "legacy-pages-backup" artifact for 30 days, then deleted, then checked to return 404.
# Delete this workflow once it has run.

name: Remove legacy pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to remove the 19 legacy pages (backed up first)"
        required: true

permissions:
  contents: read

jobs:
  remove:
    if: github.event.inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    env:
      FILES: >-
        cash-flow.html create-renew-lease.html delinquent-rent-report.html financing.html
        hoa.html income-expense-dashboard.html insurance-form.html insurance-info.html
        insurance.html lease-center.html lease-expirations.html maintenance-admin.html
        manage-properties.html property-escrow-reconciliation.html rent-log.html
        rent-payments.html rental-tracker.html submit-request.html tenant-history.html
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Back up, then delete
        env:
          HOST: ${{ secrets.BLUEHOST_FTP_SERVER }}
          FTP_USER: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          BASE: ${{ secrets.BLUEHOST_REMOTE_DIR }}
        run: |
          set -euo pipefail
          case "$BASE" in */) ;; *) BASE="$BASE/";; esac
          mkdir -p backup
          {
            # Same TLS posture as the deploy Action (FTPS, certificate not pinned).
            echo "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no"
            echo "set cmd:fail-exit no"
            for f in $FILES; do echo "get -O backup ${BASE}${f}"; done
          } > get.lftp
          lftp -u "$FTP_USER" --env-password -f get.lftp "$HOST" || true
          echo "Backed up $(ls backup | wc -l) of $(echo $FILES | wc -w) files:"
          ls -l backup

          # Refuse to delete anything that wasn't backed up.
          missing=""
          for f in $FILES; do [ -s "backup/$f" ] || missing="$missing $f"; done
          if [ -n "$missing" ]; then echo "Not on the server (skipped):$missing"; fi

          {
            echo "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no"
            echo "set cmd:fail-exit no"
            for f in $FILES; do if [ -s "backup/$f" ]; then echo "rm ${BASE}${f}"; fi; done
          } > rm.lftp
          lftp -u "$FTP_USER" --env-password -f rm.lftp "$HOST"

      - name: Keep the backup
        uses: actions/upload-artifact@v4
        with:
          name: legacy-pages-backup
          path: backup/
          retention-days: 30
          if-no-files-found: warn

      - name: Check every page now returns 404
        run: |
          set -uo pipefail
          bad=""
          for f in $FILES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://rentalgenieai.com/${f}?t=$(date +%s)")
            echo "$code  $f"
            [ "$code" = "404" ] || bad="$bad $f($code)"
          done
          if [ -n "$bad" ]; then echo "Still served:$bad" >&2; exit 1; fi
          echo "All 19 legacy pages are gone."
