
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🛠 Submit Maintenance Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fb;
      padding: 40px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #1a3c5e;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 30px;
      background-color: #1a3c5e;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    .back-link {
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>🛠 Maintenance Request</h1>
  <div class="container">
    <form id="requestForm">
      <label for="issue">Issue Description</label>
      <textarea id="issue" rows="4" placeholder="Describe the problem..." required></textarea>

      <label for="urgency">Urgency Level</label>
      <select id="urgency" required>
        <option value="Low">Low</option>
        <option value="Normal">Normal</option>
        <option value="High">High</option>
        <option value="Emergency">Emergency</option>
      </select>

      <label for="photo">Upload a Photo (optional)</label>
      <input type="file" id="photo" accept="image/*">

      <button type="submit">📨 Submit Request</button>
    </form>
  </div>

  <div class="back-link">
    <a id="backLink">🔙 Back to Portal</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tenant = decodeURIComponent(params.get('tenant') || '');
    const property = decodeURIComponent(params.get('property') || '');

    const client = supabase.createClient(
      'https://pbojacnagutipfhcxltj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0'
    );

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const issue = document.getElementById('issue').value;
      const urgency = document.getElementById('urgency').value;

      const { error } = await client.from('maintenance_requests').insert([{
        property_name: property,
        tenant_email: tenant,
        issue_description: issue,
        urgency_level: urgency
      }]);

      if (error) {
        alert('❌ Failed to submit: ' + error.message);
      } else {
        alert('✅ Your request has been submitted.');
        document.getElementById('requestForm').reset();
      }
    });
  </script>
</body>
</html>
